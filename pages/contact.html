<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Leo_Frixi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <div class="bio-bg"></div>
    <div class="particle-system" id="particleSystem"></div>

    <header>
        <nav id="navbar">
            <div class="nav-container">
                <a href="../index.html" class="logo">
                    <span class="logo-text">Leo_Frixi's Shell</span>
                </a>
                <ul class="nav-menu">
                    <li><a href="../index.html" class="nav-link">Inicio</a></li>
                    <li><a href="portfolio.html" class="nav-link">Portfolio & RVC</a></li>
                    <li><a href="about.html" class="nav-link">Sobre Mí</a></li>
                    <li><a href="contact.html" class="nav-link active">Contacto</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main class="contact" style="padding-top: 140px;">
        <div class="contact-container">
            <div class="contact-form">
                <h1 class="section-title" style="text-align: left; margin-bottom: 40px; font-size: 2.5rem;">Trabajemos Juntos</h1>
                <form id="contactForm">
                    <div class="form-group">
                        <label for="name">Nombre / Creador</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Detalles de la colaboración</label>
                        <textarea id="message" name="message" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn">⚡ Enviar Mensaje</button>
                </form>
            </div>
            <div class="contact-info">
                <h3>Contacto & Redes</h3>
                <div class="contact-item">
                    <div class="contact-icon">🌐</div>
                    <div class="contact-details">
                        <h4>Hugging Face</h4>
                        <p>Modelos públicos y datasets</p>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 Leo Frixi. All rights reserved.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
